<!-- ko if: payerFormData() -->
<div data-bind="template: {name: payerFormData().getTemplate(), data: payerFormData()}"></div>
<!-- /ko -->
<fieldset data-bind="attr: {class: 'fieldset payment items ccard payment-pagbank field-to-pay' + $parent.getCode(), id: 'payment_form_cc_' + cardIdentifier + '_' + $parent.getCode()}">
    <legend class="legend">
        <span class="legend-title" data-bind="text: getCardTitle()"></span>
        <span class="legend-icon">
            <ul class="credit-card-types">
            <!-- ko foreach: {data: getCcAvailableTypesValues(), as: 'item'} -->
                <li class="item">
                    <!--ko if: $parent.getIcons(item.value) -->
                    <img data-bind="attr: {
                        'src': $parent.getIcons(item.value).url,
                        'alt': item.type,
                        'width': $parent.getIcons(item.value).width,
                        'height': $parent.getIcons(item.value).height
                        }">
                    </img>
                    <!--/ko-->
                </li>
            <!--/ko-->
            </ul>
        </span>
    </legend>
    <div class="form-pay">
        <div class="field-to-pay" data-bind="css: { _hidden: $parent.isPlaceOrderActionAllowed() }">
            <p class="form-waiting"><!-- ko i18n: 'Waiting...'--><!-- /ko --></p>
        </div>
        <div class="field-to-pay" data-bind="css: { _hidden: !$parent.isPlaceOrderActionAllowed() }">
            <div class="field type">
                <div class="control pagbank-input-group">
                    <input type="hidden"
                        class="input-text"
                        value=""
                        data-bind="attr: {
                            id: $parent.getCode() + '_' + cardIdentifier + '_cc_type',
                            name: 'payment[' + cardIdentifier + '_cc_type]',
                            'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-type'
                        },
                        value: creditCardType">
                    </input>
                </div>
            </div>
            <!-- ko if: ($parent.isEnableDebit())-->
            <div class="field type">
                <div class="control pagbank-input-group">
                    <select class="select"
                            data-bind="attr: {
                                autocomplete: 'card-type',
                                id: $parent.getCode() + '_' + cardIdentifier + '_card_type_transaction',
                                name: 'payment[' + cardIdentifier + '_card_type_transaction]',
                                'data-container': $parent.getCode() + '-' + cardIdentifier + '-card-type-transaction',
                                'data-validate': JSON.stringify({required:true})
                            },
                            enable: $parent.isActive(),
                            options: getCardTypeTransactionValues(),
                            optionsValue: 'value',
                            optionsText: 'label',
                            optionsCaption: $t('Card Type'),
                            value: cardTypeTransaction">
                    </select>
                    <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_card_type_transaction'}" class="label">
                        <span><!-- ko i18n: 'Type Transaction'--><!-- /ko --></span>
                    </label>
                </div>
            </div>
            <!-- /ko -->
            <div class="fields number-cvv required">
                <div class="control">
                    <div class="fields group group-2">
                        <div class="field number required">
                            <div class="control pagbank-input-group _with-tooltip">
                                <input type="tel" class="input-text" value=""
                                    data-bind="attr: {
                                        autocomplete: 'cc-number',
                                        id: $parent.getCode() + '_' + cardIdentifier + '_number',
                                        name: 'payment[' + cardIdentifier + '_cc_number]',
                                        title: $t('Credit Card Number'),
                                        maxlength: '26',
                                        minlength: '8',
                                        pattern: '^[0-9\\s]+$',
                                        placeholder: $t('Credit Card Number'),
                                        'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-number',
                                        'data-validate': JSON.stringify({
                                            'required-number':true,
                                            'validate-card-type-pagbank': getCcAvailableTypesValues(),
                                            'validate-card-number-pagbank':'#' + $parent.getCode() + '_' + cardIdentifier + '_number',
                                            'validate-card-type-math-pagbank':'#' + $parent.getCode() + '_' + cardIdentifier + '_cc_type'
                                        })
                                    },
                                    enable: $parent.isActive(),
                                    value: creditCardNumber,
                                    valueUpdate: 'keyup' ">
                                </input>
                                <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_number'}" class="label">
                                    <span><!-- ko i18n: 'Credit Card Number'--><!-- /ko --></span>
                                </label>
                                <span class="field-tooltip toggle">
                                    <ul class="credit-card-types">
                                        <!-- ko foreach: {data: getCcAvailableTypesValues(), as: 'item'} -->
                                        <li class="item _hidden" data-bind="css: {
                                                _active: $parent.selectedCardType() == item.value,
                                                _hidden: $parent.selectedCardType() != item.value || !$parent.selectedCardType() 
                                            } ">
                                            <!--ko if: $parent.getIcons(item.value) -->
                                            <img data-bind="attr: {
                                                'src': $parent.getIcons(item.value).url,
                                                'alt': item.type,
                                                'width': $parent.getIcons(item.value).width,
                                                'height': $parent.getIcons(item.value).height
                                                }">
                                            <!--/ko-->
                                        </li>
                                        <!--/ko-->
                                    </ul>
                                </span>
                            </div>
                        </div>
                        <!-- ko if: (hasVerification())-->
                        <div class="field cvv required" data-bind="attr: {id: $parent.getCode() + '_' + cardIdentifier + '_type_cvv_div'}">
                            <div class="control pagbank-input-group _with-tooltip">
                                <input type="tel"
                                    class="input-text cvv"
                                    value=""
                                    data-bind="attr: {
                                        id: $parent.getCode() + '_' + cardIdentifier + '_cid',
                                        name: 'payment[' + cardIdentifier + '_cc_cid]',
                                        autocomplete: 'cc-csc',
                                        maxlength: '4',
                                        minlength: '3',
                                        pattern: '^[0-9]+$',
                                        title: $t('CVV - Card Verification Number'),
                                        placeholder: $t('CVV'),
                                        'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-cvv',
                                        'data-validate': JSON.stringify({
                                            'required-number':true,
                                            'validate-card-cvv-pagbank':'#' + $parent.getCode() + '_' + cardIdentifier + '_cc_type'
                                        })
                                    },
                                    enable: $parent.isActive(),
                                    value: creditCardVerificationNumber">
                                </input>
                                <div class="field-tooltip toggle">
                                    <span class="field-tooltip-action action-cvv"
                                        tabindex="0"
                                        data-toggle="dropdown"
                                        data-bind="attr: {title: $t('What is this?')}, mageInit: {'dropdown':{'activeClass': '_active'}}">
                                        <span><!-- ko i18n: 'What is this?'--><!-- /ko --></span>
                                    </span>
                                    <div class="field-tooltip-content"
                                        data-target="dropdown">
                                        <span translate="'A 3-digit number in italics on the back of your credit card.'"></span>
                                    </div>
                                </div>
                                <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_cid'}" class="label">
                                    <span><!-- ko i18n: 'CVV'--><!-- /ko --></span>
                                </label>
                            </div>
                        </div>
                        <!-- /ko -->
                    </div>
                </div>
            </div>
            <div class="fields expiration required" data-bind="attr: {id: $parent.getCode() + '_' + cardIdentifier + '_type_exp_div'}">
                <div class="control">
                    <div class="fields group group-2">
                        <div class="field month">
                            <div class="control pagbank-input-group">
                                <select class="select select-month"
                                        data-bind="attr: {
                                            autocomplete: 'cc-exp-month',
                                            id: $parent.getCode() + '_' + cardIdentifier + '_expiration',
                                            name: 'payment[' + cardIdentifier + '_cc_exp_month]',
                                            'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-month',
                                            'data-validate': JSON.stringify({
                                                required:true,
                                                'validate-cc-exp':'#' + $parent.getCode() + '_' + cardIdentifier + '_expiration_yr'
                                            })
                                        },
                                        enable: $parent.isActive(),
                                        options: getCcMonthsValues(),
                                        optionsValue: 'value',
                                        optionsText: 'month',
                                        optionsCaption: $t('Month'),
                                        value: creditCardExpMonth">
                                </select>
                                <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_expiration'}" class="label">
                                    <span><!-- ko i18n: 'Expiration Month'--><!-- /ko --></span>
                                </label>
                            </div>
                        </div>
                        <div class="field year">
                            <div class="control pagbank-input-group">
                                <select class="select select-year"
                                        data-bind="attr: {
                                            autocomplete: 'cc-exp-year',
                                            id: $parent.getCode() + '_' + cardIdentifier + '_expiration_yr',
                                            name: 'payment[' + cardIdentifier + '_cc_exp_year]',
                                            'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-year',
                                            'data-validate': JSON.stringify({required:true})
                                        },
                                        enable: $parent.isActive(),
                                        options: getCcYearsValues(),
                                        optionsValue: 'value',
                                        optionsText: 'year',
                                        optionsCaption: $t('Year'),
                                        value: creditCardExpYear">
                                </select>
                                <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_expiration_yr'}" class="label">
                                    <span><!-- ko i18n: 'Expiration Year'--><!-- /ko --></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="field holder fullname required">
                <div class="control pagbank-input-group">
                    <input type="text" class="input-text" value=""
                            data-bind="attr: {
                                autocomplete: 'cc-name',
                                maxlength: '26',
                                minlength: '3',
                                pattern: '^[a-zA-Z\\s]+$',
                                id: $parent.getCode() + '_' + cardIdentifier + '_cardholder_name',
                                name: 'payment[' + cardIdentifier + '_cc_cardholder_name]',
                                title: $t('Credit Card Holder Full Name'),
                                placeholder: $t('Credit Card Holder Full Name'),
                                'data-container': $parent.getCode() + '-' + cardIdentifier + '-cc-cardholder-name',
                                'data-validate': JSON.stringify({'required':true})
                            },
                            enable: $parent.isActive(),
                            value: creditCardHolderName,
                            valueUpdate: 'keyup' ">
                    </input>
                    <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_cardholder_name'}" class="label">
                        <span><!-- ko i18n: 'Credit Card Holder Full Name'--><!-- /ko --></span>
                    </label>
                </div>
            </div>
            <!-- ko if: (cardTypeTransaction() !== 'DEBIT_CARD') -->
            <div class="field installments required">
                <div class="control pagbank-input-group">
                    <select class="select select-installments"
                            data-bind="attr: {
                                autocomplete: 'off',
                                id: $parent.getCode() + '_' + cardIdentifier + '_installments',
                                name: 'payment[' + cardIdentifier + '_cc_installments]',
                                'data-container': $parent.getCode() + '-' + cardIdentifier + '-installments',
                                'data-validate': JSON.stringify({required:true})
                            },
                            enable: $parent.isActive(),
                            options: getOptionsInstallments(),
                            optionsValue: 'installment_value',
                            optionsText: 'installment_label',
                            optionsCaption: $t('Select Installment'),
                            value: creditCardInstallment">
                    </select>
                    <label data-bind="attr: {for: $parent.getCode() + '_' + cardIdentifier + '_installments'}" class="label">
                        <span><!-- ko i18n: 'Select Installment' --><!-- /ko --></span>
                    </label>
                </div>
            </div>
            <!-- /ko -->
        </div>
    </div>
</fieldset>
